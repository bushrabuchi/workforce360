<aside class="sidebar">
  <div class="brand">
    <a routerLink="/" class="brand-link">
      <img
        src="/assets/images/logo.png"
        [alt]="'Workforce360' | translate"
        class="brand-image"
      />

      <span class="brand-text">
        <span class="brand-name">{{ 'Workforce360' | translate }}</span>
        <span class="brand-subtitle">{{ 'HR Workspace' | translate }}</span>
      </span>
    </a>
  </div>

  <nav class="sidebar-nav" [attr.aria-label]="'Main navigation' | translate">
    <ul class="nav">
      @for (item of navItems; track item.link) {
        <li class="nav-item">
          <a
            [routerLink]="item.link"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.link === '/' }"
            class="nav-link"
          >
            <span class="nav-icon material-icons">
              {{ item.icon }}
            </span>

            <span class="nav-label">{{ item.label | translate }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar-bottom">
    <button
      class="language-button"
      type="button"
      (click)="languageService.toggleLanguage()"
      [attr.aria-label]="
        (languageService.isArabic() ? 'Switch to English' : 'Switch to Arabic') | translate
      "
    >
      <span class="material-symbols-outlined">language</span>
      <span>{{ languageService.isArabic() ? 'English' : 'العربية' }}</span>
      <span class="material-symbols-outlined arrow">chevron_right</span>
    </button>

    <div class="user-profile">
      <div class="avatar">B</div>

      <div class="user-details">
        <strong>Bushra</strong>
        <span>{{ 'Frontend Developer' | translate }}</span>
      </div>
    </div>
  </div>
</aside>
