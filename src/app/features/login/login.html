<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <a class="brand" routerLink="/" aria-label="Workforce360 home">
      <span class="material-symbols-outlined" aria-hidden="true">groups</span>
      <span>Workforce<span>360</span></span>
    </a>

    <div class="login-intro">
      <span class="login-eyebrow">ACCOUNT ACCESS</span>
      <h1 id="login-title">Welcome back</h1>
      <p>Sign in to continue to your Workforce360 workspace.</p>
    </div>

    <form (submit)="$event.preventDefault(); submit()">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        placeholder="you@company.com"
      />

      <div class="password-label">
        <label for="password">Password</label>
      </div>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
      />

      <button class="login-submit" type="submit">Sign in</button>
    </form>

    <p class="login-notice" role="status">
      {{ notice() || 'Sign-in is not available until an authentication service is connected.' }}
    </p>
    <p class="login-footer">Your workforce, in one place.</p>
  </section>
</main>
